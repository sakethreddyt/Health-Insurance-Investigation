<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>404 - Aadhaar file not found | Health Claim Case Desk</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f4f7fc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: 36px; border: 1px solid #dfe7f1; border-radius: 16px; background: #fff; box-shadow: 0 14px 36px rgba(15,35,70,.12); }
    .code { color: #dc2626; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 10px 0; font-size: clamp(24px, 5vw, 32px); }
    p { color: #526174; line-height: 1.65; }
    a { display: inline-block; margin-top: 12px; padding: 11px 16px; border-radius: 8px; background: #4f46e5; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #4338ca; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Aadhaar file not found</h1>
    <p>This investigator's Aadhaar upload is unavailable. It may have been removed or not restored to the uploads folder.</p>
    <p>Please ask an administrator to upload the document again.</p>
    <a href="/">Return to Health Claim Case Desk</a>
  </main>
</body>
</html>
