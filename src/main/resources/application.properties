# ---- Server ----
server.port=8080
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CDSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Cookie is HTTPS-only in production.
# The dev profile overrides this for http://localhost.
server.servlet.session.cookie.secure=true


# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/casedesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}


# ---- Hibernate / JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ---- Uploads ----
app.upload-dir=${APP_UPLOAD_DIR:./uploads}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=14MB


# ---- Secrets ----
# The dev profile supplies the development crypto key.
app.crypto.key=${APP_CRYPTO_KEY:}

# Optional bootstrap Main Admin password.
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}